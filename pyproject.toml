[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidlplus-api"
version = "0.1.0"
description = "Lidl Plus API and receipt archive with JPG and PDF export"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-only"
dependencies = ["requests", "qrcode", "pillow", "playwright"]

[project.scripts]
lidlplus = "lidlplus_api.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
